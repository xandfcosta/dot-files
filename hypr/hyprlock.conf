# PLAYER SOURCE SYMBOL
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --source-symbol)"

    color               = rgba(255, 255, 255, 0.6)
    font_size           = 16
    font_family         = $font-symbol

    position            = -33.5%, -38%
