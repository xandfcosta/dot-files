# For more information visit https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

$scrPath      = ~/.config/hypr/hyprlock/
$imgPath      = ~/.config/hypr/hyprlock/assets/

# $USER         = whoami
$host         = uname -n #Your Alias
$wifi-mode    = true # Change the WiFi output. true = show SSID, false = Connected.
$bt-mode      = false # Change the Bluetooth output. true = show Device name, false = Connected.

# WALLPAPER
# Just comment and uncomment to select
#$wallpaper    =  screenshot
$wallpaper    = ~/.config/omarchy/current/background
$blur  = 2

# ADJUST HERE
$rounding     = 12
$shape-rd     = 6
$font-text    = JetBrainsMono Nerd Font Bold
$font-text0   = GeistMono Nerd Font
$font-display = PP Neue Machina Ultra-Bold
$font-symbol  = JetBrainsMono Nerd Font Mono
# Input Var
$weight       = 2
$inner-color  = rgba(0, 0, 0, 0.5)
$border-color = rgba(255, 255, 255, 0.15)

# Colors
$clock-color  = rgba(255, 255, 255, 1)
$fg0          = rgba(255, 255, 255, 1)
$fg1          = rgba(0, 0, 0, 1)
$shape-col0   = rgba(255, 255, 255, 1)
$shape-col1   = rgba(75, 75, 75, 0.25)
$shape-col2   = rgba(255, 255, 255, 0.25)
$shadow-pass  = 2
$shadow-size  = 3
$shadow-color = rgb(0,0,0)
$shadow-boost = 1.2
$text-shadow-pass   = 1
$text-shadow-boost  = 0.5



# GENERAL
general {
    hide_cursor         = true
    ignore_empty_input  = true
    text_trim           = true
}

#BACKGROUND
background {
    monitor     = 
    path        = $wallpaper
    blur_passes         = $blur
}

# INPUT FIELD
input-field {
    monitor     =
    size        = 275, 55
    rounding    = $rounding
    
    outline_thickness   = $weight
    outer_color         = $border-color
    dots_size           = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing        = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center         = true
    
    inner_color         = $inner-color
    font_color          = $fg0
    fade_on_empty       = false
    
    font_family         = $font-text
    # placeholder_text    = <span>󰢏 $($USER)</span>
    hide_input          = false
    
    # position            = 0, -240
    halign              = center
    valign              = center
    zindex              = 10
}

# TIME 
label {
    monitor     =
    text        = $TIME
   #text        = $TIME12
    color       = $clock-color
    
    shadow_pass         = $shadow-pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost
    
    font_size           = 150
    font_family         = $font-text
    
    position            = 0, -155
    halign              = center
    valign              = top
}

# GREETING
label {
    monitor     =
    text        = cmd[update:1000] echo "$(bash $scrPath/greeting.sh), $USER"
    
    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost
    
    color               = $fg0
    font_size           = 14
    font_family         = $font-text

    position            = 0, 50
    halign              = center
    valign              = center
}

# TODAY IS
label {
    monitor     =
    text        = cmd[update:1000] bash -c 'day=$(date +%A); echo "Today is $day"'

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 11
    font_family         = $font-text

    position            = 0, -50
    halign              = center
    valign              = center
}

# DATE
label {
    monitor     =
    text        = cmd[update:1000] bash -c 'day=$(date +%d); case "$day" in 1) suffix="st";; 2) suffix="nd";; 3) suffix="rd";; *) suffix="th";; esac; echo -e "$(date +"%B %e")'$day'$suffix, $(date +%Y)"'

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 14
    font_family         = $font-text 

    position            = 0, -80
    halign              = center
    valign              = center
}

# BATTERY
label {
    monitor     =
    text        =  cmd[update:1000] echo -e "$($scrPath/battery.sh)" 
    
    color               = $fg0
    font_size           = 11
    font_family         = $font-text
    
    position            = -37, -19
    halign              = right
    valign              = top
    zindex              = 5
}

# NETWORK
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$($scrPath/network.sh)"
    
    color               = $fg0
    font_size           = 11
    font_family         = $font-text
    
    position            = 37, -19
    halign              = left
    valign              = top
    zindex              = 5
}

# BLUETOOTH
label {
    monitor     = 
    text        = cmd[update:1000] echo -e "$(~/.config/hypr/hyprlock/bluetooth.sh)"
    
    color               = $fg0
    font_size           = 11
    font_family         = $font-text
    
    position            = 37, -75
    halign 		= left
    valign 		= top
    zindex 		= 5
}


# MEDIA BG
image {
    monitor     =
    path        = $imgPath/media-bg-dark-25.png
    size        = 8% 
    opacity     = 0.25

    rounding            = 5
    border_size         = 0
    rotate              = 0

    position            = 0, -10% 
    halign              = center
    valign              = center
    zindex              = 1
}

shape {
    monitor     =
    size        = 35%, 10% 

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $shape-col1
    rounding            = $rounding
    border_size         =
    border_color        =

    position            = 0, 4%
    halign              = center
    valign              = bottom
    zindex              = 1
}

