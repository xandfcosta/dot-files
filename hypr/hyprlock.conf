# PLAYER SOURCE
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --source)"

    color               = rgba(255, 255, 255, 0.6)
    font_size           = 10
    font_family         = $font-text

    position            = -35%, -38%
    halign              = right
