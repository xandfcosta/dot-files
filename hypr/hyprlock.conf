# For more information visit https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

$scrPath      = ~/.config/hypr/hyprlock/
$imgPath      = ~/.config/hypr/hyprlock/assets/

$wallpaper    = ~/.config/omarchy/current/background
$blur  = 2

# ADJUST HERE
$rounding     = 12
$shape-rd     = 6
$font-text    = GeistMono Nerd Font 
$font-symbol  = JetBrainsMono Nerd Font Mono
$font-display = JetBrainsMono Nerd Font Bold

# Input Var
$weight       = 2
$inner-color  = rgba(0, 0, 0, 0.5)
$border-color = rgba(255, 255, 255, 0.15)

# Colors
$clock-color  = rgba(255, 255, 255, 1)
$fg0          = rgba(255, 255, 255, 1)
$fg1          = rgba(0, 0, 0, 1)
$shape-col0   = rgba(255, 255, 255, 1)
$shape-col1   = rgba(75, 75, 75, 0.25)
$shape-col2   = rgba(255, 255, 255, 0.25)
$shadow-pass  = 2
$shadow-size  = 3
$shadow-color = rgb(0,0,0)
$shadow-boost = 1.2
$text-shadow-pass   = 1
$text-shadow-boost  = 0.5



# GENERAL
general {
    hide_cursor         = true
    ignore_empty_input  = true
    text_trim           = true
}

#BACKGROUND
background {
    monitor     = 
    path        = $wallpaper
    blur_passes = $blur
}

# DATE
label {
    monitor     =
    text        = cmd[update:1000] bash -c 'day=$(date +%d); case "$day" in 1) suffix="st";; 2) suffix="nd";; 3) suffix="rd";; *) suffix="th";; esac; echo -e "  $(date +"%B %e")'$day'$suffix, $(date +%Y)"'

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 11
    font_family         = $font-text 

    position            = 2%, -2%
    halign              = left
    valign              = top
}

image {
    monitor             = 
    path                = /tmp/cover.jpeg
    rounding            = 4
    border_size         = 0
    size                = 50
    position            = -50.5%, -4.5%
    halign              = right
    valign              = top
}

# PLAYER TITLE
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --title)"

    color               = $fg0
    font_size           = 12
    font_family         = $font-text Bold
    text_align          = left

    position            = 50.5%, -5%
    halign              = left
    valign              = top
    zindex              = 5
}

# PLAYER ARTIST
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --artist)"

    color               = $fg0
    font_size           = 10
    font_family         = $font-text
    text_align          = left

    position            = 50.5%, -7%
    halign              = left
    valign              = top
    zindex              = 5
}

# PLAYER STATUS
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --status)"

    color               = $fg0
    font_size           = 11
    font_family         = $font-text

    position            = 50.5%, -2%
    halign              = left
    valign              = top
    zindex              = 5
}

# PLAYER SOURCE
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --source)"

    color               = rgba(255, 255, 255, 0.6)
    font_size           = 11
    font_family         = $font-text 

    position            = -50.5%, -2%
    halign              = right
    valign              = top
    zindex              = 5
}

# BATTERY
label {
    monitor     =
    text        =  cmd[update:1000] echo -e "$($scrPath/battery.sh)" 
    
    color               = $fg0
    font_size           = 11
    font_family         = $font-text
    
    position            = -2%, -2%
    halign              = right
    valign              = top
    zindex              = 5
}



# TIME 
label {
    monitor     =
    text        = $TIME
    color       = $clock-color
    
    shadow_passes       = $shadow-pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost
    
    font_size           = 100
    font_family         = $font-display
    
    position            = 0, 15%
    halign              = center
    valign              = center
}


# INPUT FIELD
input-field {
    monitor     =
    size        = 275, 55
    rounding    = $rounding
    
    outline_thickness   = $weight
    outer_color         = $border-color
    dots_size           = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing        = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center         = true
    
    inner_color         = $inner-color
    font_color          = $fg0
    fade_on_empty       = false
    
    font_family         = $font-text
    placeholder_text    = 
    hide_input          = false
    placeholder_text    = $USER
    
    halign              = center
    valign              = center
    zindex              = 10
}

# GREETING
label {
    monitor     =
    text        = cmd[update:1000] echo "$(bash $scrPath/greeting.sh)"

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 14
    font_family         = $font-text

    position            = 0, -5%
    halign              = center
    valign              = center
}

# TODAY IS
label {
    monitor     =
    text        = cmd[update:1000] bash -c 'day=$(date +%A); echo "Today is $day"'

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 12
    font_family         = $font-text Thin

    position            = 0, -7%
    halign              = center
    valign              = center
}

