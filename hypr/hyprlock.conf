# For more information visit https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

$scrPath      = ~/.config/hypr/hyprlock/
$imgPath      = ~/.config/hypr/hyprlock/assets/

$wallpaper    = ~/.config/omarchy/current/background
$blur  = 2

# ADJUST HERE
$rounding     = 8
$font-text    = Inter 

# Input Var
$weight       = 1
$inner-color  = rgba(0, 0, 0, 0.5)
$border-color = rgba(255, 255, 255, 0.15)

# Colors
$clock-color  = rgba(255, 255, 255, 1)
$fg0          = rgba(255, 255, 255, 1)
$fg1          = rgba(0, 0, 0, 1)
$shape-col0   = rgba(255, 255, 255, 1)
$shape-col1   = rgba(75, 75, 75, 0.25)
$shape-col2   = rgba(255, 255, 255, 0.25)
$shadow-pass  = 2
$shadow-size  = 3
$shadow-color = rgb(0,0,0)
$shadow-boost = 1.2
$text-shadow-pass   = 1
$text-shadow-boost  = 0.5



# GENERAL
general {
    hide_cursor         = true
    ignore_empty_input  = true
    text_trim           = true
}

#BACKGROUND
background {
    monitor     = 
    path        = $wallpaper
    blur_passes = $blur
}

# BATTERY
label {
    monitor     =
    text        =  cmd[update:1000] echo -e "$($scrPath/battery.sh)" 
    
    color               = $fg0
    font_size           = 11
    font_family         = $font-text
    
    position            = -2%, -2%
    halign              = right
    valign              = top
    zindex              = 5
}

# Calendar
label {
    monitor     =
    text        = cmd[update:1000] bash -c 'day=$(date +%d); case "$day" in 1) suffix="st";; 2) suffix="nd";; 3) suffix="rd";; *) suffix="th";; esac; echo -e "$(date +"%B %e")'$day'$suffix, $(date +%Y)"'

    color               = $fg0
    font_size           = 20
    font_family         = $font-text Medium

    position            = 0%, -7.5%
    halign              = center
    valign              = top
}

# TIME 
label {
    monitor     =
    text        = $TIME
    color       = $clock-color
    
    font_size           = 120
    font_family         = $font-text Black
    
    position            = 0, -8%
    halign              = center
    valign              = top
}

# TODAY IS
label {
    monitor     =
    text        = cmd[update:1000] bash -c 'day=$(date +%A); echo "Today is $day"'

    color               = $fg0
    font_size           = 16
    font_family         = $font-text

    position            = 0, -24%
    halign              = center
    valign              = top
}

# PLAYER SOURCE
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --source)"

    color               = rgba(255, 255, 255, 0.6)
    font_size           = 11
    font_family         = $font-text 

    position            = 0%, 22%
    halign              = center
    valign              = bottom
    zindex              = 5
}

# PLAYER COVER
image {
    monitor             = 
    path                = /tmp/cover.jpeg
    rounding            = 4
    border_size         = 0
    size                = 100
    reload_time         = 2
    reload_cmd          = ~/.config/waybar/scripts/album_art.sh

    position            = 0%, 12%
    halign              = center
    valign              = bottom
    zindex              = 5
}

# PLAYER TITLE
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --title)"

    color               = $fg0
    font_size           = 12
    font_family         = $font-text Bold
    text_align          = center

    position            = 0%, 9%
    halign              = center
    valign              = bottom
    zindex              = 5
}

# PLAYER ARTIST
label {
    monitor     =
    text        = cmd[update:1000] echo "$($scrPath/playerctl.sh --artist)"

    color               = $fg0
    font_size           = 10
    font_family         = $font-text
    text_align          = center

    position            = 0%, 7%
    halign              = center
    valign              = bottom
    zindex              = 5
}
# INPUT FIELD
input-field {
    monitor     =
    size        = 275, 55
    rounding    = $rounding
    
    outline_thickness   = $weight
    outer_color         = $border-color
    dots_size           = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing        = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center         = true
    
    inner_color         = $inner-color
    font_color          = $fg0
    fade_on_empty       = false
    
    font_family         = $font-text
    placeholder_text    = 
    hide_input          = false
    placeholder_text    = $USER
    
    halign              = center
    valign              = center
    zindex              = 10
}

# GREETING
label {
    monitor     =
    text        = cmd[update:1000] echo "$(bash $scrPath/greeting.sh)"

    color               = $fg0
    font_size           = 14
    font_family         = $font-text

    position            = 0, 5%
    halign              = center
    valign              = center
}
