# Warm (yellow) screen all day.
#
# hyprsunset applies a profile from its `time` until the next profile, so a
# single profile at 00:00 and no others covers the entire day. The commented-out
# `identity = true` profile that used to sit here is what kept the screen
# neutral -- leave it out.
#
# Note that Kelvin runs the opposite way to "warmth": LOWER is yellower.
#   6500 = neutral (hyprsunset doing nothing)
#   4000 = Omarchy's nightlight setting
#   3500 = clearly yellow
#   3000 = strong amber
profile {
    time = 00:00
    temperature = 4000
}
