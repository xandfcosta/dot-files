# Extra autostart processes
# exec-once = uwsm app -- my-service


exec-once = [workspace 1 silent] $browser
exec-once = [workspace 2 silent] $terminal
exec-once = [workspace 3 silent] omarchy-launch obsidian
exec-once = [workspace 5 silent] omarchy-launch discord
# exec-once = [workspace special:scratchpad silent] omarchy-launch spotify
exec-once = [workspace special:scratchpad silent] omarchy-launch-tui ncspot

windowrule {
  name = open-discord-on-workspace-5
  match:title = ^(discord)$
  workspace = 5 silent
}

windowrule {
  name = open-spotify-on-scratchpad
  match:class = ^(spotify)$
  workspace = special:scratchpad silent
}
