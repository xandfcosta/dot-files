# NVIDIA hybrid (Intel iGPU primary, NVIDIA dGPU on-demand via prime-run)
#
# Omarchy's nvidia.sh auto-added the block below. It forces the NVIDIA driver
# GLOBALLY for VA-API decode + GLX/OpenGL for EVERY app, defeating an
# iGPU-primary hybrid setup. Ref: github.com/basecamp/omarchy/issues/1776
# (explicitly warns against setting these globally). Disabled on purpose;
# NVIDIA is used per-app via `prime-run`.
#
# NOTE: this file is NOT sourced by hyprland.conf on this install (it sources
# the default envs.conf), so these were already inert. Kept commented so a
# future migration re-sourcing this file can't silently re-enable them.
#
# env = NVD_BACKEND,direct
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
