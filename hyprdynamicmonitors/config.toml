[general]
destination = "$HOME/.config/hypr/monitors.conf"

[power_events]

[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_ACAD"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_ACAD"



[profiles.docked]
config_file = "/home/xand/.config/hyprdynamicmonitors/hyprconfigs/docked.go.tmpl"
config_file_type = "template"
[profiles.docked.static_template_values]
mode = "dual"  # external_only | dual  — toggle via `hdm-docked-toggle`
[profiles.docked.conditions]

[[profiles.docked.conditions.required_monitors]]
description = "AOC 24G2W1G4 ATNM4XA001012"
monitor_tag = "monitor0"

[[profiles.docked.conditions.required_monitors]]
description = "AU Optronics 0x21ED"
monitor_tag = "monitor1"



[profiles.undocked]
config_file = "/home/xand/.config/hyprdynamicmonitors/hyprconfigs/undocked.go.tmpl"
config_file_type = "template"
[profiles.undocked.conditions]

[[profiles.undocked.conditions.required_monitors]]
description = "AU Optronics 0x21ED"
monitor_tag = "monitor1"
