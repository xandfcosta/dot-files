source-file ~/.config/omarchy/current/theme/tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@color_red},fg=#{@color_bg},bold]  #S },#{#[bg=#{@color_bg},fg=#{@color_green}]  #S }}"
set -ga status-left "#[bg=#{@color_bg},fg=#{@color_foreground},none]│"
set -ga status-left "#[bg=#{@color_bg},fg=#{@color_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@color_bg},fg=#{@color_foreground},none]│"
set -ga status-left "#[bg=#{@color_bg},fg=#{@color_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@color_bg},fg=#{@color_foreground},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@color_bg},fg=#{@color_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Configure Tmux
set -g status-position top
set -g status-style "bg=#{@color_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@color_bg},fg=#{@color_foreground}"
setw -g pane-border-style "bg=#{@color_bg},fg=#{@color_border}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@color_bg},fg=#{@color_text_primary}"
set -g window-status-last-style "bg=#{@color_bg},fg=#{@color_text_secondary}"
set -g window-status-activity-style "bg=#{@color_accent},fg=#{@color_bg}"
set -g window-status-bell-style "bg=#{@color_red},fg=#{@color_bg},bold"
set -gF window-status-separator "#[bg=#{@color_bg},fg=#{@color_foreground}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@color_text_secondary},fg=#{@color_bg},bold"

# Start windows and panes on 1
set -g base-index 1 
set -g pane-base-index 1 
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use mouse
set -g mouse on

# Fix nvim colorscheme
set -sg terminal-overrides ",*:RGB"
set-window-option -g mode-keys vi

# Better motion on copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open windows and panes on same dir
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

